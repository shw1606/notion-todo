# XcodeGen 정의. 생성: `cd apps && xcodegen` → NotionTodo.xcodeproj
# 앱·위젯 모두 멀티플랫폼 타깃(iOS·iPadOS·macOS) 하나씩이다.
name: NotionTodo
options:
  bundleIdPrefix: io.github.notiontodo
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_STYLE: Automatic
  configs:
    Release:
      # 앱 용량 (DECISIONS 2026-11-11). 실행 파일이 번들의 98%이고 그 2/3가 기호 표였다.
      # 아카이브가 아닌 Release 빌드(로컬 설치용)에서도 기호를 떼어 낸다. 기호는 dSYM에 남는다.
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_STYLE: all
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      # 화면 몇 개짜리 앱이라 속도보다 크기를 고른다.
      SWIFT_OPTIMIZATION_LEVEL: -Osize
      GCC_OPTIMIZATION_LEVEL: s

packages:
  NotionTodoKit:
    path: Packages

targets:
  NotionTodo:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: NotionTodo
      - path: Shared
    dependencies:
      - package: NotionTodoKit
        product: NotionKit
      - package: NotionTodoKit
        product: TodoCore
      - package: NotionTodoKit
        product: DesignSystem
      - target: NotionTodoWidgets
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_NAME: Todo Widget for Notion
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).notiontodo
        # INFOPLIST_KEY_* 설정은 이게 YES여야 Info.plist에 들어간다 (info.path 파일과 합쳐진다).
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS[sdk=iphone*]: NotionTodo/NotionTodo-iOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: NotionTodo/NotionTodo-macOS.entitlements
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
        INFOPLIST_KEY_CFBundleDisplayName: Todo Widget  # 한국어는 InfoPlist.xcstrings
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UILaunchScreen_Generation[sdk=iphone*]: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone[sdk=iphone*]: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad[sdk=iphone*]: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation[sdk=iphone*]: YES
        INFOPLIST_KEY_UIApplicationSupportsMultipleScenes[sdk=iphone*]: YES
    info:
      path: NotionTodo/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [notiontodo]
        NTAppGroupID: $(NT_APP_GROUP_ID)
        NTKeychainGroup: $(NT_KEYCHAIN_GROUP)
        NTOAuthClientID: $(NT_OAUTH_CLIENT_ID)
        NTAuthBaseURL: $(NT_AUTH_BASE_URL)
        ITSAppUsesNonExemptEncryption: false

  NotionTodoWidgets:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: NotionTodoWidgets
      - path: Shared
    dependencies:
      - package: NotionTodoKit
        product: NotionKit
      - package: NotionTodoKit
        product: TodoCore
      - package: NotionTodoKit
        product: DesignSystem
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_NAME: NotionTodoWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).notiontodo.widgets
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS[sdk=iphone*]: NotionTodoWidgets/NotionTodoWidgets-iOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: NotionTodoWidgets/NotionTodoWidgets-macOS.entitlements
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
        INFOPLIST_KEY_CFBundleDisplayName: Todo Widget  # 한국어는 InfoPlist.xcstrings
    info:
      path: NotionTodoWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NTAppGroupID: $(NT_APP_GROUP_ID)
        NTKeychainGroup: $(NT_KEYCHAIN_GROUP)
        NTOAuthClientID: $(NT_OAUTH_CLIENT_ID)
        NTAuthBaseURL: $(NT_AUTH_BASE_URL)

  NotionTodoWidgetsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NotionTodoWidgetsTests
      - path: NotionTodoWidgets/TodoWidgetViews.swift
      - path: NotionTodoWidgets/TodoTimeline.swift
      - path: Shared/TodoIntents.swift
    dependencies:
      - package: NotionTodoKit
        product: NotionKit
      - package: NotionTodoKit
        product: TodoCore
      - package: NotionTodoKit
        product: DesignSystem
      - sdk: WidgetKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).notiontodo.widgettests
        GENERATE_INFOPLIST_FILE: YES

  NotionTodoUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    sources:
      - path: NotionTodoUITests
    dependencies:
      - target: NotionTodo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).notiontodo.uitests
        TEST_TARGET_NAME: NotionTodo
        GENERATE_INFOPLIST_FILE: YES

schemes:
  NotionTodo:
    build:
      targets:
        NotionTodo: all
        NotionTodoWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NotionTodoUITests
    archive:
      config: Release
  WidgetSnapshots:
    build:
      targets:
        NotionTodoWidgetsTests: [test]
    test:
      config: Debug
      targets:
        - NotionTodoWidgetsTests
  NotionTodoWidgets:
    build:
      targets:
        NotionTodoWidgets: all
        NotionTodo: all
    run:
      config: Debug
      askForAppToLaunch: true
