# XcodeGen 정의. 생성: `cd apps && xcodegen` → NotionTodo.xcodeproj
# 앱·위젯 모두 멀티플랫폼 타깃(iOS·iPadOS·macOS) 하나씩이다.
name: NotionTodo
options:
  bundleIdPrefix: io.github.notiontodo
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_STYLE: Automatic

packages:
  NotionTodoKit:
    path: Packages

targets:
  NotionTodo:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: NotionTodo
      - path: Shared
    dependencies:
      - package: NotionTodoKit
        product: NotionKit
      - package: NotionTodoKit
        product: TodoCore
      - package: NotionTodoKit
        product: DesignSystem
      - target: NotionTodoWidgets
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_NAME: Notion Todo
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).notiontodo
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS[sdk=iphone*]: NotionTodo/NotionTodo-iOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: NotionTodo/NotionTodo-macOS.entitlements
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
        INFOPLIST_KEY_CFBundleDisplayName: Notion Todo
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIApplicationSupportsMultipleScenes: YES
    info:
      path: NotionTodo/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [notiontodo]
        NTAppGroupID: $(NT_APP_GROUP_ID)
        NTKeychainGroup: $(NT_KEYCHAIN_GROUP)
        NTOAuthClientID: $(NT_OAUTH_CLIENT_ID)
        NTAuthBaseURL: $(NT_AUTH_BASE_URL)
        ITSAppUsesNonExemptEncryption: false

  NotionTodoWidgets:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: NotionTodoWidgets
      - path: Shared
    dependencies:
      - package: NotionTodoKit
        product: NotionKit
      - package: NotionTodoKit
        product: TodoCore
      - package: NotionTodoKit
        product: DesignSystem
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_NAME: NotionTodoWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).notiontodo.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS[sdk=iphone*]: NotionTodoWidgets/NotionTodoWidgets-iOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: NotionTodoWidgets/NotionTodoWidgets-macOS.entitlements
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
        INFOPLIST_KEY_CFBundleDisplayName: Notion Todo
    info:
      path: NotionTodoWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NTAppGroupID: $(NT_APP_GROUP_ID)
        NTKeychainGroup: $(NT_KEYCHAIN_GROUP)
        NTOAuthClientID: $(NT_OAUTH_CLIENT_ID)
        NTAuthBaseURL: $(NT_AUTH_BASE_URL)

  NotionTodoWidgetsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NotionTodoWidgetsTests
      - path: NotionTodoWidgets/TodoWidgetViews.swift
      - path: NotionTodoWidgets/TodoTimeline.swift
      - path: Shared/TodoIntents.swift
    dependencies:
      - package: NotionTodoKit
        product: NotionKit
      - package: NotionTodoKit
        product: TodoCore
      - package: NotionTodoKit
        product: DesignSystem
      - sdk: WidgetKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).notiontodo.widgettests
        GENERATE_INFOPLIST_FILE: YES

  NotionTodoUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    sources:
      - path: NotionTodoUITests
    dependencies:
      - target: NotionTodo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).notiontodo.uitests
        TEST_TARGET_NAME: NotionTodo
        GENERATE_INFOPLIST_FILE: YES

schemes:
  NotionTodo:
    build:
      targets:
        NotionTodo: all
        NotionTodoWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NotionTodoUITests
    archive:
      config: Release
  WidgetSnapshots:
    build:
      targets:
        NotionTodoWidgetsTests: [test]
    test:
      config: Debug
      targets:
        - NotionTodoWidgetsTests
  NotionTodoWidgets:
    build:
      targets:
        NotionTodoWidgets: all
        NotionTodo: all
    run:
      config: Debug
      askForAppToLaunch: true
